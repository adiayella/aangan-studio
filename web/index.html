<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aangan Designer Desk</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a4532b'/%3E%3Cpath d='M9 23V12l7-5 7 5v11h-5v-6h-4v6z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span><div><strong>Aangan Studio</strong><small>Designer Desk</small></div></div>
  <div class="who">
    <label class="sr" for="designer">Designer</label>
    <select id="designer" hidden></select>
    <span id="who" class="chip"></span>
    <button id="forget" class="ghost" title="Remove the private link from this device">Sign out</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main class="layout">
  <section class="list-pane" aria-label="Leads">
    <div class="stats" id="stats"></div>
    <div class="tools">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="tabs" id="decisions" aria-label="Filter by decision"></div>
      <input id="search" type="search" placeholder="Search name, area, phone" aria-label="Search leads">
    </div>
    <ul id="list" class="list"></ul>
  </section>
  <section class="detail-pane" id="detail" aria-live="polite"></section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
