<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aangan Designer Desk</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a4532b'/%3E%3Cpath d='M9 23V12l7-5 7 5v11h-5v-6h-4v6z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span><div><strong>Aangan Studio</strong><small>Designer Desk</small></div></div>
  <div class="who">
    <label class="sr" for="designer">Designer</label>
    <select id="designer"></select>
    <span id="mode" class="chip"></span>
    <button id="connect" class="ghost">Sign in</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main class="layout">
  <section class="list-pane" aria-label="Leads">
    <div class="stats" id="stats"></div>
    <div class="tools">
      <div class="tabs" role="tablist" id="tabs"></div>
      <input id="search" type="search" placeholder="Search name, area, phone" aria-label="Search leads">
    </div>
    <ul id="list" class="list"></ul>
  </section>
  <section class="detail-pane" id="detail" aria-live="polite"></section>
</main>

<dialog id="dlg">
  <form id="dlgForm">
    <h2>Sign in</h2>
    <p>Use the email and password your admin set up for you. You stay signed in only while this tab is open.</p>
    <label class="fld">Email<input id="email" type="email" autocomplete="username" required></label>
    <label class="fld">Password<input id="password" type="password" autocomplete="current-password" required></label>
    <p id="authErr" class="authErr" role="alert" hidden></p>
    <div class="row"><button type="button" id="cancel" class="ghost">Cancel</button><button type="submit" class="primary" id="go">Sign in</button></div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
